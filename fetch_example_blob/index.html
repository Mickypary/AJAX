<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: #ffcc00;
        font-family: sans-serif;
      }

      h1 {
        text-align: center;
        padding-top: 140px;
        font-size: 60px;
        margin: -15px;
      }

      p {
        text-align: center;
        color: #907400;
      }

      p#btn {
        cursor: pointer;
      }

      img {
        margin: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <h1 id="iptext">This will be replaced with a joke</h1>
    <br />
    <p>( This is your IP address ... probably )</p>
    <p id="btn">Show Image</p>
    <img width="30%" />

    <script>
      // ****** UNIVERSAL FUNCTIONS
      function checkStatus(response) {
        if (response.ok) {
          return Promise.resolve(response);
        } else {
          return Promise.reject(new Error("custom error message"));
        }
      }

      function convertToBlob(response) {
        return response.blob();
      }

      function convertToJson(response) {
        return response.json();
      }

      // **************************** FETCHING JOKES

      let url = "https://icanhazdadjoke.com/";
      // use the Headers Interface
      let h = new Headers();
      h.append("Accept", "application/json");

      // use the Request Interface
      let req = new Request(url, {
        method: "GET",
        headers: h,
      });

      // using then
      // fetch(req)
      //   .then(checkStatus)
      //   .then((res) => res.json())
      //   .then((data) => {
      //     document.getElementById("iptext").innerHTML = data.joke;
      //   })
      //   .catch((err) => console.log("Oops, there was a network error"));

      // Using async await
      async function randomJoke() {
        let response = await fetch(req);
        let goodResponse = await checkStatus(response);
        let data = await convertToJson(goodResponse);
        document.getElementById("iptext").innerHTML = data.joke;
      }

      randomJoke();

      // **************************** FETCHING THE IMAGE
      let btn = document.getElementById("btn");
      let imgEl = document.getElementsByTagName("img")[0];
      let imageURL = "Ajax_system.png";
      btn.addEventListener("click", function () {
        let h = new Headers();
        h.append("Accept", "image/png");
        let req = new Request(imageURL, {
          headers: h,
        });

        // fetch using then
        // fetch(req)
        //   .then(checkStatus)
        //   .then((res) => {
        //     return res.blob();
        //   })
        //   .then((blob) => {
        //     let pictureURL = URL.createObjectURL(blob);
        //     imgEl.src = pictureURL;
        //     // imgEl.width = "1000";
        //     console.log("SUCCESS");
        //   })
        //   .catch((err) => console.log("NOW this will catch all errors: ", err));

        // fetch using async await
        async function fetchImage() {
          try {
            let response = await fetch(req);
            let goodResponse = await checkStatus(response);
            let blobData = await convertToBlob(goodResponse);
            let pictureURL = URL.createObjectURL(blobData);
            imgEl.src = pictureURL;
            // imgEl.width = "1000";
            console.log("SUCCESS");
          } catch (e) {
            console.log("hello world, oops ", e);
          }
        }

        fetchImage();
      });

      // How you would implement thumbnail display for file input element using URL Interface
      // let fileUploadButton = document.querySelector("input[type=file]");
      // let previewImage = document.getElementById("preview");
      // fileUploadButton.addEventListener("change", (e) => {
      //   let url = URL.createObjectURL(e.target.files[0]);
      //   previewImage.setAttribute("src", url);
      // });
    </script>
  </body>
</html>
