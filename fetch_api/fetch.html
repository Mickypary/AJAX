<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetch</title>
  </head>
  <body>
    <script>
      let url = "https://jsonplaceholder.typicode.com/todos/1";
      let promise = fetch(url)
        .then((res) => res.json())
        .then((data) => console.log(data.title))
        .catch((e) =>
          console.log(
            "Oops, this has been awkward - there's been a network error",
            e,
          ),
        );
    </script>
  </body>
</html>
